<style>
/* Layout: a training log — sticky header with countdown, one view at a time (Week / Calendar / Stats), a side drawer for run detail. Race-bib numerals for times. */
:root {
  --bg: #f1f3ee;
  --surface: #ffffff;
  --surface-2: #e7eae2;
  --line: #d5d9cd;
  --fg: #151a12;
  --fg-2: #4a5244;
  --muted: #737b6c;
  --accent: #4f7a00;
  --accent-strong: #3d5f00;
  --accent-ink: #ffffff;
  --accent-soft: #e3edcc;
  --good: #1f8a4c;
  --warn: #b26b00;
  --bad: #c2362b;
  --easy: #2f6fb5;
  --long: #7a52b3;
  --hard: #d0611a;
  --race: #4f7a00;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f120d; --surface: #171b14; --surface-2: #20261c; --line: #2d3527;
    --fg: #eef2e8; --fg-2: #b3bba9; --muted: #838c79;
    --accent: #c8f031; --accent-strong: #d8f86a; --accent-ink: #12160a; --accent-soft: #2a3612;
    --good: #4ccf83; --warn: #f0b443; --bad: #f2776c;
    --easy: #6aa6ea; --long: #b392ea; --hard: #f2924f; --race: #c8f031;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f120d; --surface: #171b14; --surface-2: #20261c; --line: #2d3527;
  --fg: #eef2e8; --fg-2: #b3bba9; --muted: #838c79;
  --accent: #c8f031; --accent-strong: #d8f86a; --accent-ink: #12160a; --accent-soft: #2a3612;
  --good: #4ccf83; --warn: #f0b443; --bad: #f2776c;
  --easy: #6aa6ea; --long: #b392ea; --hard: #f2924f; --race: #c8f031;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 88px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.15; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.01em; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent-strong); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 780px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.eyebrow { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand-mark { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; white-space: nowrap; font-style: italic; color: var(--accent); letter-spacing: 0.02em; line-height: 1; }
.brand-sub { font-size: 0.8rem; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; margin-left: auto; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; font-weight: 500; color: var(--fg-2); }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.bottom { display: none; }
@media (max-width: 640px) {
  .tabs { display: none; }
  .bottom { display: flex; position: fixed; inset: auto 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .bottom button { flex: 1; border: 0; background: none; padding: 8px 0; font-weight: 600; font-size: 0.85rem; color: var(--muted); border-radius: 8px; }
  .bottom button[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
}

main { padding-block: 20px; display: flex; flex-direction: column; gap: 18px; }
.banner { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; font-size: 0.9rem; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.banner.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.banner .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
.banner.warn .dot { background: var(--warn); }
.banner.bad .dot { background: var(--bad); }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.small { padding: 5px 10px; font-size: 0.85rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent-strong); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

/* Week header */
.week-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.week-head .range { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; line-height: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 0.75rem; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--fg-2); font-weight: 500; }
.chip.accent { background: var(--accent-soft); color: var(--accent-strong); }

/* Generate card */
.gen { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.gen label { font-size: 0.85rem; font-weight: 600; color: var(--fg-2); display: flex; flex-direction: column; gap: 6px; }
textarea, input[type="text"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; width: 100%; resize: vertical; }
.daypick { display: flex; gap: 6px; flex-wrap: wrap; }
.daypick button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 0; width: 46px; font-weight: 600; font-size: 0.85rem; color: var(--fg-2); }
.daypick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--fg-2); font-size: 0.9rem; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* Summary */
.summary { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; color: var(--fg-2); }

/* Day list */
.days { display: flex; flex-direction: column; gap: 8px; }
.day { display: grid; grid-template-columns: 58px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-align: left; width: 100%; }
button.day:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.day.today { box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
.day.rest { background: transparent; }
.day.done { background: color-mix(in srgb, var(--good) 11%, var(--surface)); border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.day.done .title { color: var(--fg); }
.day.missed { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.status.done { background: var(--good); color: var(--surface); padding: 1px 8px; border-radius: 99px; }
.day .dname { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.1; }
.day .ddate { font-size: 0.75rem; color: var(--muted); }
.day .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.day .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.day .title { font-weight: 600; }
.day .km { margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.day .details { color: var(--fg-2); font-size: 0.88rem; }
.targets { display: flex; gap: 6px; flex-wrap: wrap; }
.t { font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.t b { color: var(--fg); font-weight: 600; }
.tag { font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--easy); }
.tag.long { color: var(--long); }
.tag.hard { color: var(--hard); }
.tag.race { color: var(--race); }
.tag.rest { color: var(--muted); }
.status { font-size: 0.8rem; font-weight: 600; }

.status.missed { color: var(--bad); }
.done-line { font-size: 0.9rem; font-weight: 600; color: var(--good); font-variant-numeric: tabular-nums; }

/* Chat */
.chat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msgs { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; }
.msg { max-width: 88%; padding: 9px 12px; border-radius: 12px; font-size: 0.92rem; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent-soft); color: var(--fg); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.chat form { display: flex; gap: 8px; }
.chat form textarea { min-height: 44px; }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 2px; font-weight: 600; }
.cell { min-height: 78px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; }
.cell.off { background: transparent; border-style: dashed; opacity: 0.45; }
.cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cell.race { background: var(--accent-soft); border-color: var(--accent); }
.cell.ran { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
button.cell:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.cell .d { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .r { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1; }
.cell .rp { font-size: 0.68rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.cell .p { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; border-bottom: 2px dashed currentColor; padding: 0 0 1px; align-self: flex-start; color: var(--easy); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .p.hard { color: var(--hard); } .cell .p.long { color: var(--long); } .cell .p.race { color: var(--race); }
.cell .miss { font-size: 0.66rem; color: var(--bad); font-weight: 700; }
.month { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; margin-top: 6px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Stats */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 18px; }
.big { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 0.95; font-variant-numeric: tabular-nums; }
.big.goal { color: var(--accent-strong); }
.mid { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 0.9rem; }
.kv dt { color: var(--fg-2); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.gapbar { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.gapbar > div { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.profile svg { height: 34px; }
.profile.big svg { height: auto; }
.profile .ax { font-size: 10px; }
.profile .tip, .profile .legend { font-family: var(--font-body); font-weight: 400; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart .bar { fill: var(--accent); }
.chart .bar.pre { fill: var(--line); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .goalline { stroke: var(--fg-2); stroke-dasharray: 5 4; stroke-width: 1.5; }
.chart .goallbl { fill: var(--fg-2); font-size: 10px; font-family: var(--font-body); }
.tip { font-size: 0.82rem; color: var(--fg-2); min-height: 1.3em; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { width: min(560px, 100%); height: 100%; background: var(--bg); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px; display: flex; flex-direction: column; gap: 16px; border-left: 1px solid var(--line); }
.drawer-head { display: flex; align-items: flex-start; gap: 12px; }
.drawer-head .x { margin-left: auto; flex: none; }
.statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.verdict { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border-radius: 6px; align-self: flex-start; }
.verdict.nailed { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.verdict.good { background: var(--accent-soft); color: var(--accent-strong); }
.verdict.off-target { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.verdict.unplanned { background: var(--surface-2); color: var(--fg-2); }
.prose { display: flex; flex-direction: column; gap: 10px; color: var(--fg); }
.prose p { white-space: pre-wrap; }
ul.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--fg-2); }
.shoe { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.shoe .glyph { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; background: var(--accent-soft); color: var(--accent-strong); flex: none; }
.empty { text-align: center; padding: 28px 16px; color: var(--fg-2); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 10px; align-items: center; }
</style>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <span class="brand-mark">Sub 20 Challenge</span>
      <span class="brand-sub" id="countdown"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button type="button" data-view="week">Week</button>
      <button type="button" data-view="calendar">Calendar</button>
      <button type="button" data-view="stats">Stats</button>
    </nav>
  </div>
</header>

<main class="wrap" id="view">
  <div class="empty"><div class="spinner"></div><p>Loading your runs from Strava…</p></div>
</main>

<nav class="bottom" id="bottom" aria-label="Sections">
  <button type="button" data-view="week">Week</button>
  <button type="button" data-view="calendar">Calendar</button>
  <button type="button" data-view="stats">Stats</button>
</nav>

<div class="scrim" id="scrim" hidden>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
</div>

<script>
"use strict";
/* ================= Challenge constants ================= */
const START = "2026-11-02";          // baseline 5K
const RACE = "2026-12-10";
const GOAL_S = 19 * 60 + 59;         // 19:59
const GOAL_PACE = GOAL_S / 5;
const CONTEXT_FROM = "2026-10-05";   // 4 weeks before for training-load context
const STRAVA = "Strava";
const SHOES = {
  vomero: { name: "Nike Vomero Plus", glyph: "V", role: "Max-cushion daily trainer · ≈1 year old" },
  cloudmonster: { name: "On Cloudmonster 3 Hyper", glyph: "C", role: "Cushioned, responsive trainer · brand new" },
  vaporfly: { name: "Nike Vaporfly 4", glyph: "VF", role: "Carbon-plated racer · ≈1 year old" },
  none: { name: "Rest day", glyph: "–", role: "" },
};
/** km each pair had before it was added to Strava (Nov 2026): runs from 3 Nov 2025 – 2 Nov 2026,
 *  under 6 km = Vaporfly, 6 km+ = Vomero, × 1.2 for unlogged running. */
const SHOE_START_KM = { vaporfly: 241, vomero: 352, cloudmonster: 0 };
const TYPES = {
  run: ["Run", ""], easy: ["Easy", ""], recovery: ["Recovery", ""], long: ["Long", "long"], shakeout: ["Shake-out", ""],
  intervals: ["Intervals", "hard"], tempo: ["Tempo", "hard"], goalpace: ["Goal pace", "hard"], timetrial: ["Time trial", "hard"],
  race: ["Race", "race"], football: ["Football", "hard"], rest: ["Rest", "rest"], cross: ["Cross-train", "rest"],
};
const SHORT = { easy: "Easy", recovery: "Rec", long: "Long", shakeout: "Shake", intervals: "Int", tempo: "Tempo", goalpace: "Goal", timetrial: "TT", race: "Race", football: "Ball", rest: "Rest", cross: "X" };
const HARD = ["intervals", "tempo", "goalpace", "timetrial", "race", "football"];
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const BE_LONG = { Fastest2Mile: 3218.69, Fastest5k: 5000, Fastest10k: 10000 };
const BE_SHORT = { Fastest1k: 1000, FastestMile: 1609.34 };
const BE_LABEL = { Fastest400: "400 m", FastestHalfMile: "½ mile", Fastest1k: "1 km", FastestMile: "1 mile", Fastest2Mile: "2 miles", Fastest5k: "5 km", Fastest10k: "10 km" };

/* ================= Small utilities ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const wday = (s) => (parse(s).getDay() + 6) % 7;
const monday = (s) => addDays(s, -wday(s));
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const fdate = (s, o = { weekday: "short", day: "numeric", month: "short" }) => parse(s).toLocaleDateString("en-GB", o);
const fmtT = (sec) => { if (sec == null || !isFinite(sec)) return "–"; const s = Math.round(sec), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };

const num = (v) => (typeof v === "number" && isFinite(v) ? v : undefined);
const uid = () => Math.random().toString(36).slice(2, 10);

/* ================= VDOT model (Jack Daniels) ================= */
const vo2 = (v) => -4.6 + 0.182258 * v + 0.000104 * v * v;
const frac = (t) => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);
const vdot = (m, s) => { const t = s / 60; return vo2(m / t) / frac(t); };
const velFor = (o) => { const a = 0.000104, b = 0.182258, c = -4.6 - o; return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); };

const trainPaces = (v) => ({ easy: [paceAt(v, 0.74), paceAt(v, 0.65)], thr: paceAt(v, 0.88), int: paceAt(v, 0.98), rep: paceAt(v, 1.07) });
const GOAL_VDOT = vdot(5000, GOAL_S);

const RUN_TYPES = ["Run", "TrailRun", "VirtualRun"];
function mapRun(a) {
  const s = a.summary || {};
  const km = num(s.distance) ?? 0;
  return {
    id: String(a.id), name: a.name || "Run", date: String(a.start_local || "").slice(0, 10), start: a.start_local,
    km, moving: num(s.moving_time) ?? 0, elapsed: num(s.elapsed_time) ?? 0, pace: num(s.avg_pace) ?? (km ? (s.moving_time / km) : undefined),
    elev: num(s.elevation_gain), cadence: num(s.avg_cadence) ? s.avg_cadence * 2 : undefined, kcal: num(s.total_calories),
    effort: num(s.relative_effort), weather: a.weather || null, gear: a.gear_id || null, sport: a.sport_type,
  };
}
function mapPerf(p) {
  const best = {};
  for (const b of p.best_efforts || []) if (b && num(b.value) && (b.unit === "seconds" || !b.unit)) best[b.type_value || b.name] = b.value;
  const avgHr = num(p.average_heartrate) ?? num(p.avg_heartrate) ?? num(p.average_heart_rate);
  const maxHr = num(p.max_heartrate) ?? num(p.max_heart_rate);
  const laps = (p.laps || []).map((l) => ({
    m: num(l.distance) ?? 0, t: num(l.moving_time) ?? num(l.elapsed_time) ?? 0, speed: num(l.avg_speed),
    watts: num(l.avg_watts), cad: num(l.avg_cadence) ? l.avg_cadence * 2 : undefined,
    hr: num(l.average_heartrate) ?? num(l.avg_heartrate), elev: num(l.elevation_gain),
  }));
  return { hasHr: !!p.has_heartrate, avgHr, maxHr, watts: num(p.average_watts), rpe: num(p.perceived_exertion), best, laps };
}
async function loadStrava(refresh = false) {

      { cache: { staleTime: 0, gcTime: 6048e5, refresh: true } });
    const list = (res.payload && res.payload.activities) || [];

function shoeKey(text) {

const gearFor = (key) => (S.gear || []).find((g) => g.key === key && !g.retired);
const gearById = (id) => (S.gear || []).find((g) => g.id === String(id));
/** km run in each shoe since the challenge started, from runs tagged on Strava */
function shoeKmSince(id, from = START) { return S.runs.filter((r) => r.gear === String(id) && r.date >= from).reduce((a, r) => a + r.km, 0); }

/* ================= Analytics ================= */
const runsOn = (d) => S.runs.filter((r) => r.date === d).sort((a, b) => b.km - a.km);
const challengeRuns = () => S.runs.filter((r) => r.date >= START);
const weekKm = (m) => S.runs.filter((r) => r.date >= m && r.date <= addDays(m, 6)).reduce((a, r) => a + r.km, 0);

function evidence(runs) {
  const long = [], short = [];
  for (const r of runs) {
    const p = S.perf[r.id];
    if (p) {
      for (const [k, m] of Object.entries(BE_LONG)) if (p.best[k]) long.push({ run: r, label: BE_LABEL[k], m, s: p.best[k], v: vdot(m, p.best[k]) });
      for (const [k, m] of Object.entries(BE_SHORT)) if (p.best[k]) short.push({ run: r, label: BE_LABEL[k], m, s: p.best[k], v: vdot(m, p.best[k]) });
    }
    if (r.km >= 3 && r.moving > 0 && !(p && p.best.Fastest5k)) long.push({ run: r, label: `whole run (${r.km.toFixed(2)} km)`, m: r.km * 1000, s: r.moving, v: vdot(r.km * 1000, r.moving) });
  }
  return { long, short };
}
function baseline() {
  for (const r of runsOn(START)) {
    const p = S.perf[r.id];
    const s = p?.best.Fastest5k ?? (r.km >= 4.9 ? r.moving * (5 / r.km) : undefined);
    if (s) return { run: r, s };
  }
}
function prediction(asOf = today()) {
  const recent = S.runs.filter((r) => r.date >= addDays(asOf, -27) && r.date <= asOf);
  const ev = evidence(recent);
  const best = ev.long.sort((a, b) => b.v - a.v)[0];
  const base = baseline();
  if (!best && !base) return null;
  const v = best ? best.v : vdot(5000, base.s);
  const sb = ev.short.sort((a, b) => b.v - a.v)[0];
  // weekly trend of best long effort since the start (needs ≥3 weeks)
  const byWeek = new Map();
  for (const e of evidence(challengeRuns()).long) { const w = monday(e.run.date); byWeek.set(w, Math.max(byWeek.get(w) || 0, e.v)); }
  const pts = [...byWeek.entries()].sort();
  let trend = null;
  if (pts.length >= 3) {
    const xs = pts.map(([w]) => daysBetween(START, w) / 7), ys = pts.map(([, y]) => y);
    const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
    const den = xs.reduce((a, x) => a + (x - mx) ** 2, 0);
    if (den > 0) { const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / den; trend = { slope, atRace: predictS(my + slope * (daysBetween(START, RACE) / 7 - mx), 5000), n: pts.length }; }
  }
  return { v, s: predictS(v, 5000), basis: best, base, ceiling: sb && sb.v > v ? { s: predictS(sb.v, 5000), basis: sb } : null, trend };
}
/** Power: watts per (m/s) from runs with power, and the 5K power you've shown */
function powerModel() {
  const pts = [];
  for (const r of S.runs.filter((x) => x.date >= addDays(today(), -42))) {
    const p = S.perf[r.id];
    if (p?.watts && r.moving > 0) pts.push({ r, wPerMs: p.watts / ((r.km * 1000) / r.moving), watts: p.watts });
  }
  if (!pts.length) return null;
  const ratios = pts.map((x) => x.wPerMs).sort((a, b) => a - b);
  const ratio = ratios[Math.floor(ratios.length / 2)];
  const base = baseline();
  const base5kW = base ? S.perf[base.run.id]?.watts : undefined;
  return { ratio, goalW: ratio * (5000 / GOAL_S), base5kW, n: pts.length };
}
function hrZones() {
  const z = S.zones?.heart_rate_zones;
  if (!Array.isArray(z) || z.length < 5) return null;
  return z.map((x, i) => ({ zone: i + 1, min: x.min, max: x.max }));
}
function workPace(run, s) {
  if (!s || !HARD.includes(s.type) || !s.paceMax) return;
  const p = S.perf[run.id];
  if (!p) return;
  if ((s.type === "timetrial" || s.type === "race") && p.best.Fastest5k) return p.best.Fastest5k / 5;
  if (p.laps.length < 3) return;
  const target = (s.paceMin + s.paceMax) / 2;
  const cutoff = target * 1.15;
  const work = p.laps.filter((l) => l.m >= 200 && l.t > 0 && l.t / (l.m / 1000) <= cutoff);
  const m = work.reduce((a, l) => a + l.m, 0), t = work.reduce((a, l) => a + l.t, 0);
  return m ? t / (m / 1000) : undefined;
}

/* ================= Plan rules (safety net under the coach) ================= */
function validate(sessions, weekStart) {
  const issues = [];
  const by = new Map(sessions.map((s) => [s.date, s]));
  const hard = (d) => { const s = by.get(d); return !!s && HARD.includes(s.type); };
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i);
    if (hard(d) && hard(addDays(d, 1))) issues.push({ block: true, text: `Hard sessions on back-to-back days (${fdate(d)} and ${fdate(addDays(d, 1))}).` });
    if (by.get(d)?.type === "long" && hard(addDays(d, 1))) issues.push({ block: false, text: `Long run on ${fdate(d)} is the day before a hard session.` });
  }
  const nHard = sessions.filter((s) => HARD.includes(s.type) && s.type !== "race").length;
  if (nHard > 3) issues.push({ block: true, text: `${nHard} hard sessions in one week (max 3).` });
  for (const s of sessions) if (HARD.includes(s.type) && s.type !== "race" && s.date < RACE && daysBetween(s.date, RACE) <= 2) issues.push({ block: true, text: `Hard session on ${fdate(s.date)} is within 2 days of the race.` });
  const prev = [1, 2, 3].map((k) => weekKm(addDays(weekStart, -7 * k)));
  const avg = prev.reduce((a, b) => a + b, 0) / 3;
  const km = sessions.filter((s) => s.type !== "football").reduce((a, s) => a + (s.distanceKm || 0), 0) + S.runs.filter((r) => r.date >= weekStart && r.date < today()).reduce((a, r) => a + r.km, 0);
  if (avg > 8 && km > avg * 1.3) issues.push({ block: false, text: `≈${km.toFixed(0)} km of running this week vs ${avg.toFixed(0)} km/week over the last 3 weeks (+${Math.round((km / avg - 1) * 100)}%).` });
  return issues;
}

/* ================= Coach context for Claude ================= */
const COACH = `You are the coach inside the Sub 20 Challenge app. Your one athlete (Erim, 65 kg, London) is training for "Sub 20 Challenge": a 5K under 20:00 on Thursday 10 December 2026.

Coaching rules:

  vomero = Nike Vomero Plus, max-cushion daily trainer, ≈1 year old → easy, recovery, most long runs.

    if (r.weather?.temperature != null) line += `, ${Math.round(r.weather.temperature)}°C`;
    if (r.gear && gearById(r.gear)) line += `, shoe ${gearById(r.gear).name}`;

    if (pf?.best?.Fastest1k) line += `, best 1K ${fmtT(pf.best.Fastest1k)}`;
    if (planned) line += ` | planned: ${planned.title} (${planned.distanceKm} km)`;
    if (pf?.laps?.length >= 3 && pf.laps.length <= 30) line += `\n    laps: ${pf.laps.map((l) => `${Math.round(l.m)}m ${fmtP(l.t / (l.m / 1000))}${l.watts ? " " + Math.round(l.watts) + "W" : ""}`).join("; ")}`;
    L.push(line);
  }
  if (!recent.length) L.push("- none");
  L.push("WEEKLY KM (most recent first): " + [1, 2, 3, 4].map((k) => { const w = addDays(weekStart, -7 * k); return `${w}: ${weekKm(w).toFixed(1)}`; }).join(", "));
  const prev = S.weeks[addDays(weekStart, -7)];
  if (prev) {
    const planned = prev.sessions.filter((s) => s.type !== "rest" && s.type !== "cross");
    L.push(`LAST WEEK'S PLAN: ${planned.filter((s) => runsOn(s.date).length).length}/${planned.length} runs completed. Notes then: "${prev.notes || "—"}"`);
  }
  const done = S.runs.filter((r) => r.date >= weekStart && r.date < asOf);
  if (done.length) L.push("ALREADY RUN THIS WEEK: " + done.map((r) => `${r.date} ${r.km.toFixed(1)} km`).join(", "));
  L.push("NOT IN THE DATA: sleep, HRV, resting HR, injuries — rely on the athlete's notes.");
  return L.join("\n");
}

/* ================= Claude calls ================= */
function sampleMsg(e) {
  switch (e?.code) {
    case "cancelled": return null;
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed": return "Claude isn’t available to this page. Allow Sub 20 Challenge to use Claude when asked, or open it in claude.ai.";
    case "rate_limited": return "You’ve hit a Claude usage limit. Try again a little later.";
    case "session_expired": return "Your claude.ai session expired. Sign in again and reload.";
    case "invalid_json": return "The coach’s answer came back garbled. Try again.";
    case "refused": return "Claude declined that request. Try rephrasing.";
    case "prompt_too_large": return "Too much data for one request.";
    default: return "Couldn’t reach Claude just now. Try again.";
  }
}
async function analyse(run) {
  const s = S.weeks[monday(run.date)]?.sessions?.find((x) => x.date === run.date) || null;
  const pf = S.perf[run.id];
  const wp = workPace(run, s);
  const detail = {
    date: run.date, name: run.name, distanceKm: +run.km.toFixed(2), movingTime: fmtT(run.moving), elapsedTime: fmtT(run.elapsed), avgPace: fmtP(run.pace),
    workRepPace: wp ? fmtP(wp) : undefined, avgPowerW: pf?.watts && Math.round(pf.watts), avgHr: pf?.avgHr, maxHr: pf?.maxHr, hasHeartRate: pf?.hasHr ?? false,
    cadenceSpm: run.cadence && Math.round(run.cadence), elevationGainM: run.elev, weather: run.weather, perceivedExertion: pf?.rpe,
    bestEfforts: pf ? Object.fromEntries(Object.entries(pf.best).map(([k, v]) => [BE_LABEL[k] || k, fmtT(v)])) : undefined,
    laps: pf?.laps?.map((l) => ({ m: Math.round(l.m), pace: fmtP(l.t / (l.m / 1000)), watts: l.watts && Math.round(l.watts), spm: l.cad && Math.round(l.cad), hr: l.hr && Math.round(l.hr) })),
  };
  const planned = s ? { type: s.type, title: s.title, distanceKm: s.distanceKm, details: s.details, pace: s.paceMax ? `${fmtP(s.paceMin)}–${fmtP(s.paceMax)}` : null, power: s.powerMax ? `${s.powerMin}–${s.powerMax} W` : null, hr: s.hrMax ? `${s.hrMin}–${s.hrMax}` : null, shoe: s.shoe } : null;
  const prompt = `${COACH}\n\n${context(monday(run.date), run.date)}\n\nANALYSE THIS RUN.\nPLANNED SESSION: ${planned ? JSON.stringify(planned) : "none — unplanned run"}\nRUN DATA: ${JSON.stringify(detail)}\n\nCompare what was done against the plan and the sub-20 goal, with specific numbers (pace, power, splits consistency, cadence; HR only if recorded — otherwise say HR wasn't recorded and use power as the effort measure). Reply with only this JSON:\n{"verdict":"nailed|good|off-target|unplanned","headline":"one sentence","vsTarget":"actual vs planned in 2–3 sentences","effort":"what power/HR/cadence say about effort and fitness, 2–3 sentences","analysis":"2–3 short paragraphs separated by blank lines: what went well, what didn't, what it means for sub-20","nextTime":["2–4 concrete suggestions for upcoming runs"]}`;
  const ctl = new AbortController();
  S.busy = { kind: "analyse", ctl, runId: run.id }; render();
  try {
    const out = await S.sample.json(prompt, { cache: false, signal: ctl.signal });
    S.analyses[run.id] = {
      verdict: ["nailed", "good", "off-target", "unplanned"].includes(out?.verdict) ? out.verdict : (s ? "good" : "unplanned"),
      headline: String(out?.headline || ""), vsTarget: String(out?.vsTarget || ""), effort: String(out?.effort || ""), analysis: String(out?.analysis || ""),
      nextTime: Array.isArray(out?.nextTime) ? out.nextTime.map(String) : [], at: Date.now(),
    };
    S.busy = null; render();
    await saveAnalysis(run.id);
  } catch (e) {
    S.busy = null; S.sampleErr = sampleMsg(e); render();
  }
}

/* ---------- Session profile: each section in order, height = pace ---------- */
const PIECE_COLOR = { easy: "var(--easy)", work: "var(--hard)", stride: "var(--long)", rest: "var(--line)" };
function pieces(s) {
  const out = [];
  for (const g of s.segments || []) {
    if (g.reps && g.work) {
      for (let i = 1; i <= g.reps; i++) {
        out.push({ kind: g.kind === "strides" ? "stride" : "work", km: g.work.km, pace: g.work.pace, label: `${g.label} ${i}/${g.reps}` });
        if (g.rest && (i < g.reps || !g.dropLastRest)) out.push({ kind: "rest", km: g.rest.km, pace: g.rest.pace, label: g.rest.label || "Recovery" });
      }
    } else if (g.km) out.push({ kind: "easy", km: g.km, pace: g.pace, label: g.label });
  }
  return out.filter((p) => p.km > 0 && Array.isArray(p.pace));
}
function profile(s, big) {
  const ps = pieces(s);
  if (!ps.length) return "";
  const W = big ? 360 : 600, H = big ? 130 : 34, B = big ? 18 : 0, T = big ? 14 : 1;
  const total = ps.reduce((a, p) => a + p.km, 0);
  const mid = (p) => (p.pace[0] + p.pace[1]) / 2;
  // one fixed scale for every session: 9:00/km at the bottom, 3:30/km at the top
  const floor = 540, top = 210;
  const hgt = (pace) => { const sp = 1 / Math.min(Math.max(pace, top), floor); return Math.max(2, ((sp - 1 / floor) / (1 / top - 1 / floor)) * (H - T - B)); };
  let x = 0, g = "";
  for (const p of ps) {
    const w = (p.km / total) * W, h = hgt(mid(p));
    const pace = p.pace[0] === p.pace[1] ? fmtT(p.pace[0]) : `${fmtT(p.pace[0])}–${fmtT(p.pace[1])}`;
    const dist = p.km >= 1 ? `${+p.km.toFixed(2)} km` : `${Math.round(p.km * 1000)} m`;
    g += `<g data-tip="${esc(p.label)} · ${esc(dist)} @ ${esc(pace)}/km"><rect x="${x.toFixed(2)}" y="${T}" width="${Math.max(0.5, w).toFixed(2)}" height="${H - T - B}" fill="transparent"/><rect x="${(x + 0.5).toFixed(2)}" y="${(H - B - h).toFixed(2)}" width="${Math.max(0.5, w - 1).toFixed(2)}" height="${h.toFixed(2)}" rx="${big ? 2 : 1}" fill="${PIECE_COLOR[p.kind]}"/></g>`;
    x += w;
  }
  if (big) {
    const work = ps.filter((p) => p.kind === "work");
    const refs = [...new Set([work.length ? mid(work[0]) : null, mid(ps.find((p) => p.kind === "easy") || ps[0])].filter(Boolean).map(Math.round))];
    g = refs.map((r) => `<line class="grid" x1="0" x2="${W}" y1="${(H - B - hgt(r)).toFixed(1)}" y2="${(H - B - hgt(r)).toFixed(1)}" stroke-dasharray="3 3"/><text class="ax" x="${W}" y="${(H - B - hgt(r) - 3).toFixed(1)}" text-anchor="end">${fmtT(r)}/km</text>`).join("") + g;
    g += `<text class="ax" x="0" y="${H - 4}">0</text><text class="ax" x="${W}" y="${H - 4}" text-anchor="end">${+(s.distanceKm || total).toFixed(1)} km</text>`;
  }
  const kinds = [...new Set(ps.map((p) => p.kind))];
  const legend = big ? `<div class="legend small">${kinds.map((k) => `<span><i class="sw" style="background:${PIECE_COLOR[k]}"></i>${{ easy: "Easy / warm-up", work: "Work", stride: "Strides", rest: "Recovery" }[k]}</span>`).join("")}</div>` : "";
  return `<div class="chart profile${big ? " big" : ""}"><svg viewBox="0 0 ${W} ${H}" ${big ? "" : 'preserveAspectRatio="none"'} role="img" aria-label="Session sections in order">${g}</svg>${big ? `<div class="tip" aria-live="polite">Hover or tap a section for its pace.</div>` : ""}${legend}</div>`;
}

function renderWeek() {

function chartBars(weeks) {
  const W = 360, H = 170, L = 28, R = 6, T = 12, B = 22;
  const max = Math.max(10, ...weeks.map((w) => w.km)) * 1.15;
  const iw = W - L - R, ih = H - T - B, bw = iw / weeks.length;
  const y = (v) => T + ih - (v / max) * ih;
  const ticks = [0, Math.round(max / 2 / 5) * 5, Math.round(max / 5) * 5].filter((v, i, a) => a.indexOf(v) === i && v <= max);
  let g = ticks.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("");
  weeks.forEach((w, i) => {
    const x = L + i * bw, bwid = Math.min(26, bw - 6), cx = x + bw / 2, hgt = Math.max(0, T + ih - y(w.km));
    const r = Math.min(4, hgt, bwid / 2);
    const top = y(w.km);
    const path = hgt > 0 ? `M${cx - bwid / 2},${T + ih} V${top + r} Q${cx - bwid / 2},${top} ${cx - bwid / 2 + r},${top} H${cx + bwid / 2 - r} Q${cx + bwid / 2},${top} ${cx + bwid / 2},${top + r} V${T + ih} Z` : "";
    g += `<g data-tip="Week of ${esc(fdate(w.w, { day: "numeric", month: "short" }))}: ${w.km.toFixed(1)} km${w.pre ? " (before the challenge)" : ""}"><rect x="${x}" y="${T}" width="${bw}" height="${ih}" fill="transparent"/>${path ? `<path class="bar${w.pre ? " pre" : ""}" d="${path}"/>` : ""}<text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(fdate(w.w, { day: "numeric", month: "short" }))}</text></g>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly distance in km">${g}</svg><div class="tip" aria-live="polite"></div></div>`;
}
function chartPred(points) {
  if (points.length < 2) return `<p class="muted small">The trend line appears after two or more runs of 3 km+.</p>`;
  const W = 360, H = 180, L = 34, R = 8, T = 14, B = 22;
  const vals = [...points.map((p) => p.s), GOAL_S];
  const lo = Math.floor((Math.min(...vals) - 20) / 30) * 30, hi = Math.ceil((Math.max(...vals) + 20) / 30) * 30;
  const t0 = parse(points[0].d).getTime(), t1 = Math.max(parse(points[points.length - 1].d).getTime(), t0 + 86400000);
  const x = (d) => L + ((parse(d).getTime() - t0) / (t1 - t0)) * (W - L - R);
  const Y = (s) => H - B - ((hi - s) / (hi - lo)) * (H - T - B); // faster times plot higher
  const ticks = [lo, Math.round((lo + hi) / 2 / 30) * 30, hi];
  let g = ticks.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 5}" y="${Y(v) + 3}" text-anchor="end">${fmtT(v)}</text>`).join("");
  g += `<line class="goalline" x1="${L}" x2="${W - R}" y1="${Y(GOAL_S)}" y2="${Y(GOAL_S)}"/><text class="goallbl" x="${W - R}" y="${Y(GOAL_S) - 5}" text-anchor="end">Goal 19:59</text>`;
  g += `<path class="line" d="${points.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)},${Y(p.s).toFixed(1)}`).join(" ")}"/>`;
  g += points.map((p) => `<g data-tip="${esc(fdate(p.d))}: ${esc(p.label)} → 5K equivalent ${fmtT(p.s)}"><circle cx="${x(p.d)}" cy="${Y(p.s)}" r="12" fill="transparent"/><circle class="dot" cx="${x(p.d)}" cy="${Y(p.s)}" r="4"/></g>`).join("");
  const first = points[0].d, last = points[points.length - 1].d;
  g += `<text class="ax" x="${L}" y="${H - 6}">${esc(fdate(first, { day: "numeric", month: "short" }))}</text><text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${esc(fdate(last, { day: "numeric", month: "short" }))}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="5K-equivalent of your best effort per run">${g}</svg><div class="tip" aria-live="polite"></div></div>`;
}

function renderStats() {
  const t = today();

  const pw = powerModel();
  const z = hrZones();

  const gap = p.s - GOAL_S;
  const base = p.base;
  const prog = base ? Math.max(0, Math.min(1, (base.s - p.s) / Math.max(1, base.s - GOAL_S))) : 0;

    <div><div class="eyebrow">Baseline · 2 Nov</div><div class="big">${base ? fmtT(base.s) : "–"}</div><p class="small muted">${base ? esc(base.run.name) : "No 5K on 2 Nov"}</p></div>
  </section>`;
  if (base) h += `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="small">Progress from baseline to goal</span><span class="small num muted">${Math.round(prog * 100)}%</span></div><div class="gapbar" role="progressbar" aria-valuenow="${Math.round(prog * 100)}" aria-valuemin="0" aria-valuemax="100"><div style="width:${prog * 100}%"></div></div></div>`;

  // honest read
  const weeksLeft = Math.max(0.5, left / 7);
  const need = GOAL_VDOT - p.v;
  const perWeek = need / weeksLeft;
  const read = need <= 0 ? "Your data already supports a sub-20 5K. Stay healthy and execute on race day."
    : perWeek <= 0.3 ? `On track: you need +${need.toFixed(1)} VDOT in ${left} days (${perWeek.toFixed(2)}/week), which is a typical rate for consistent training.`
    : perWeek <= 0.6 ? `Possible but tight: you need +${need.toFixed(1)} VDOT in ${left} days (${perWeek.toFixed(2)}/week), above what most runners gain. It needs near-perfect consistency.`
    : `Unlikely on current data: you need +${need.toFixed(1)} VDOT in ${left} days (${perWeek.toFixed(2)}/week), roughly double a typical rate. Train for it, but expect something between your prediction and 20:00.`;
  h += `<div class="card"><h3>Where you stand</h3><p>${esc(read)}</p>
    <dl class="kv">
      <dt>Current VDOT</dt><dd>${p.v.toFixed(1)}</dd>
      <dt>VDOT for 19:59</dt><dd>${GOAL_VDOT.toFixed(1)}</dd>
      ${p.ceiling ? `<dt>Ceiling from ${esc(p.ceiling.basis.label)}</dt><dd>${fmtT(p.ceiling.s)}</dd>` : ""}
      ${p.trend ? `<dt>Trend (${p.trend.n} weeks)</dt><dd>${p.trend.slope >= 0 ? "+" : ""}${p.trend.slope.toFixed(2)}/week → ${fmtT(p.trend.atRace)}</dd>` : `<dt>Trend</dt><dd class="muted">after 3 weeks</dd>`}
      ${S.zones?.sample_race_pace ? `<dt>Strava’s own estimate</dt><dd>${esc(S.zones.sample_race_pace.time)}</dd>` : ""}
    </dl>
    <p class="small muted">The prediction uses only your best effort of 2 miles or longer in the last 28 days. Shorter efforts are shown as a ceiling, because short speed overstates 5K endurance.</p></div>`;

  // charts
  const weeks = [];
  for (let w = monday(CONTEXT_FROM); w <= monday(t); w = addDays(w, 7)) weeks.push({ w, km: weekKm(w), pre: w < monday(START) });
  const pts = [];
  for (const r of S.runs.filter((x) => x.date >= CONTEXT_FROM)) {
    const e = evidence([r]).long.sort((a, b) => b.v - a.v)[0];
    if (e) pts.push({ d: r.date, s: predictS(e.v, 5000), label: e.label });
  }
  h += `<div class="grid2"><section class="card"><h3>Weekly distance</h3>${chartBars(weeks)}<p class="small muted">Grey bars: the 4 weeks before the challenge.</p></section>
    <section class="card"><h3>5K-equivalent per run</h3>${chartPred(pts)}<p class="small muted">Each dot is the best effort of 2 miles or longer from one run (or the whole run), converted to a 5K time. Easy runs sit low by design.</p></section></div>`;

  // paces / power / HR
  const tp = trainPaces(p.v);
  h += `<div class="grid2"><section class="card"><h3>Training paces now</h3><dl class="kv">
      <dt>Easy / long</dt><dd>${fmtP(tp.easy[0])} – ${fmtP(tp.easy[1])}</dd>
      <dt>Threshold (tempo)</dt><dd>${fmtP(tp.thr)}</dd>
      <dt>Interval</dt><dd>${fmtP(tp.int)}</dd>
      <dt>Sub-20 goal pace</dt><dd>${fmtP(GOAL_PACE)}</dd></dl>
      <p class="small muted">These update as your fitness changes in the data.</p></section>
    <section class="card"><h3>Power & heart rate</h3><dl class="kv">
      ${pw?.base5kW ? `<dt>Baseline 5K power</dt><dd>${Math.round(pw.base5kW)} W · ${(pw.base5kW / 65).toFixed(1)} W/kg</dd>` : ""}
      ${pw ? `<dt>Power needed for 19:59</dt><dd>≈${Math.round(pw.goalW)} W</dd><dt>Watts per m/s (median, ${pw.n} runs)</dt><dd>${pw.ratio.toFixed(1)}</dd>` : `<dt>Power</dt><dd class="muted">no data</dd>`}
      ${z ? z.map((x) => `<dt>HR zone ${x.zone}</dt><dd>${x.min}${x.max ? "–" + x.max : "+"} bpm</dd>`).join("") : ""}
    </dl><p class="small muted">${challengeRuns().some((r) => S.perf[r.id]?.hasHr) ? "Heart rate is being recorded." : "Your recent runs have no heart-rate data, so power is the effort measure. HR targets assume a strap or watch."}</p></section></div>`;

  // shoes
  const gearKnown = (S.gear || []).filter((g) => !g.retired);
  h += `<section class="card"><h3>Shoes</h3>${gearKnown.length ? `<div class="tablewrap"><table><thead><tr><th>Shoe</th><th class="r">Before</th><th class="r">Strava</th><th class="r">Total</th><th class="r">Challenge</th></tr></thead><tbody>${gearKnown.map((g) => `<tr><td style="white-space:normal">${esc(g.key ? SHOES[g.key].name : g.name)}${g.nick && g.nick !== g.name ? ` <span class="muted">(${esc(g.nick)})</span>` : ""}</td><td class="r">${g.start ? "≈" + g.start : "0"}</td><td class="r">${g.strava.toFixed(1)}</td><td class="r"><strong>${g.km.toFixed(0)}</strong>${g.key === "vaporfly" && g.km > 400 ? ` <span style="color:var(--warn)">· foam ageing</span>` : ""}</td><td class="r">${shoeKmSince(g.id).toFixed(1)}</td></tr>`).join("")}</tbody></table></div><p class="small muted">km. “Before” is an estimate from your runs of the past year (under 6 km in the Vaporfly, 6 km+ in the Vomero, ×1.2). “Challenge” counts km since 2 Nov. Tag each new run with its shoe in Strava and the totals count up.</p>${["vomero", "cloudmonster", "vaporfly"].filter((k) => !gearFor(k)).length ? `<p class="small muted">Not found on Strava: ${["vomero", "cloudmonster", "vaporfly"].filter((k) => !gearFor(k)).map((k) => esc(SHOES[k].name)).join(", ")}. Name them with “Vomero”, “Cloudmonster” or “Vaporfly” so they can be matched.</p>` : ""}` : `<p class="small">${S.gear ? "No shoes on your Strava yet." : "Loading shoes from Strava…"}</p><p class="small muted">Add your Vomero Plus, Cloudmonster 3 Hyper and Vaporfly 4 in Strava (Settings → My Gear → Add Shoes, with an estimate of the km already on them), and pick the shoe on each run. The app then tracks mileage and checks the shoe you wore against the plan.</p>`}</section>`;

  return h;
}

/* ---------- Drawer: one day / one run ---------- */
function renderDrawer() {
  const d = S.drawer?.date;
  if (!d) return "";
  const runs = runsOn(d);
  const s = S.weeks[monday(d)]?.sessions?.find((x) => x.date === d);
  let h = `<div class="drawer-head"><div><div class="eyebrow">${esc(fdate(d, { weekday: "long", day: "numeric", month: "long" }))}</div><h2 id="drawer-title">${esc(runs[0]?.name || s?.title || (d === RACE ? "Race day" : "Day"))}</h2></div><button class="btn small x" data-act="close" aria-label="Close">Close</button></div>`;
  if (s) {
    h += `<section class="card"><div class="row1" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${tag(s.type)}<strong>${esc(s.title)}</strong>${s.distanceKm ? `<span class="mono">${esc(s.distanceKm)} km</span>` : ""}</div>
      ${s.details ? `<p>${esc(s.details)}</p>` : ""}${profile(s, true)}${targets(s)}
      ${s.tips?.length ? `<div><div class="eyebrow">Tips</div><ul class="tips">${s.tips.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}</section>`;
  } else if (d === RACE) {
    h += `<section class="card"><p>Race day: 5K under 19:59, about ${fmtP(GOAL_PACE)}. The race-week plan appears once you ask Claude for it on Monday 7 December.</p></section>`;
  }
  for (const r of runs) h += runDetail(r, s);
  if (!runs.length && s && s.type !== "rest" && d < today()) h += `<div class="banner bad"><span class="dot"></span><div>No run recorded on Strava for this day.</div></div>`;
  return h;
}
function runDetail(r, s) {
  const pf = S.perf[r.id];
  const wp = workPace(r, s);
  const a = S.analyses[r.id];
  let h = `<section class="statrow">
    <div class="stat"><div class="k">Distance</div><div class="v">${r.km.toFixed(2)} km</div></div>
    <div class="stat"><div class="k">Time</div><div class="v">${fmtT(r.moving)}</div></div>
    <div class="stat"><div class="k">Avg pace</div><div class="v">${fmtT(r.pace)}</div></div>
    ${wp ? `<div class="stat"><div class="k">Work pace</div><div class="v">${fmtT(wp)}</div></div>` : ""}
    ${pf?.watts ? `<div class="stat"><div class="k">Power</div><div class="v">${Math.round(pf.watts)} W</div></div>` : ""}
    ${pf?.avgHr ? `<div class="stat"><div class="k">Avg HR</div><div class="v">${Math.round(pf.avgHr)}</div></div>` : ""}
    ${r.cadence ? `<div class="stat"><div class="k">Cadence</div><div class="v">${Math.round(r.cadence)}</div></div>` : ""}
    ${r.elev != null ? `<div class="stat"><div class="k">Elevation</div><div class="v">${Math.round(r.elev)} m</div></div>` : ""}
  </section>`;
  if (s && s.paceMax && HARD.includes(s.type)) {
    const target = (s.paceMin + s.paceMax) / 2;
    const got = wp || r.pace;
    const dev = got && target ? ((got - target) / target) * 100 : null;
    h += `<p class="small">Target ${fmtT(s.paceMin)}–${fmtT(s.paceMax)}/km · ${wp ? "work reps" : "whole run"} ${fmtP(got)}${dev != null ? ` (${dev > 0 ? "+" : ""}${dev.toFixed(1)}%)` : ""}</p>`;
  }
  if (pf && Object.keys(pf.best).length) h += `<div class="targets">${Object.keys(BE_LABEL).filter((k) => pf.best[k]).map((k) => `<span class="t">${esc(BE_LABEL[k])} <b>${fmtT(pf.best[k])}</b></span>`).join("")}</div>`;
  const worn = r.gear ? gearById(r.gear) : null;
  if (worn) h += `<p class="small">Shoe: <strong>${esc(worn.name)}</strong>${s?.shoe && s.shoe !== "none" && worn.key && worn.key !== s.shoe ? ` <span class="muted">(plan said ${esc(SHOES[s.shoe].name)})</span>` : ""}</p>`;
  else if (r.gear === null && S.gear?.length) h += `<p class="small muted">No shoe tagged on this run in Strava.</p>`;
  if (r.weather) h += `<p class="small muted">${esc([r.weather.condition, r.weather.temperature != null ? Math.round(r.weather.temperature) + "°C" : null, r.weather.wind_speed != null ? Math.round(r.weather.wind_speed) + " km/h wind" : null].filter(Boolean).join(" · "))}</p>`;
  if (pf?.laps?.length > 1) h += `<div class="tablewrap"><table><thead><tr><th>Lap</th><th class="r">m</th><th class="r">Pace</th><th class="r">W</th><th class="r">spm</th>${pf.laps.some((l) => l.hr) ? `<th class="r">HR</th>` : ""}</tr></thead><tbody>${pf.laps.map((l, i) => `<tr><td>${i + 1}</td><td class="r">${Math.round(l.m)}</td><td class="r">${l.m ? fmtT(l.t / (l.m / 1000)) : "–"}</td><td class="r">${l.watts ? Math.round(l.watts) : "–"}</td><td class="r">${l.cad ? Math.round(l.cad) : "–"}</td>${pf.laps.some((x) => x.hr) ? `<td class="r">${l.hr ? Math.round(l.hr) : "–"}</td>` : ""}</tr>`).join("")}</tbody></table></div>`;
  h += `<section class="card" aria-labelledby="an-${esc(r.id)}"><h3 id="an-${esc(r.id)}">Coach’s analysis</h3>`;
  if (S.busy?.kind === "analyse" && S.busy.runId === r.id) h += busyLine("analyse", "The coach is reviewing this run…");
  else if (a) {
    h += `<span class="verdict ${esc(a.verdict)}">${esc({ nailed: "Nailed it", good: "Good", "off-target": "Off target", unplanned: "Unplanned" }[a.verdict] || a.verdict)}</span>
      <p><strong>${esc(a.headline)}</strong></p><div class="prose">${a.vsTarget ? `<p>${esc(a.vsTarget)}</p>` : ""}${a.effort ? `<p>${esc(a.effort)}</p>` : ""}${String(a.analysis).split(/\n\s*\n/).map((x) => `<p>${esc(x.trim())}</p>`).join("")}</div>
      ${a.nextTime?.length ? `<div><div class="eyebrow">Next time</div><ul class="tips">${a.nextTime.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      <p class="small muted">Analysed ${esc(new Date(a.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))} · <button class="linkish" data-act="analyse" data-run="${esc(r.id)}" ${S.busy || !S.sample ? "disabled" : ""}>Analyse again</button></p>`;
  } else h += `<p class="muted small">${pf ? "Compare this run with its target and the sub-20 goal." : "Loading laps and best efforts from Strava…"}</p><button class="btn primary" data-act="analyse" data-run="${esc(r.id)}" ${S.busy || !S.sample || !pf ? "disabled" : ""}>Analyse this run</button>`;
  h += `</section>`;
  return h;
}

function renderHeader() {
  const left = daysBetween(today(), RACE);
  $("#countdown").textContent = left >= 0 ? `${left} day${left === 1 ? "" : "s"} to go` : "Race done";
  for (const b of document.querySelectorAll("[data-view]")) b.setAttribute("aria-current", b.dataset.view === S.view ? "page" : "false");
}
let lastView = null;
function render() {
  renderHeader();
  const view = $("#view");
  if (S.stravaLoading && !S.runs.length && !S.stravaErr) view.innerHTML = `<div class="empty"><div class="spinner"></div><p>Loading your runs from Strava…</p></div>`;
  else view.innerHTML = S.view === "week" ? renderWeek() : S.view === "calendar" ? renderCalendar() : renderStats();
  if (lastView !== S.view) { window.scrollTo(0, 0); lastView = S.view; }
  const scrim = $("#scrim");
  if (S.drawer) { $("#drawer").innerHTML = renderDrawer(); scrim.hidden = false; } else scrim.hidden = true;
}

/* ================= Events ================= */
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]");
  if (v) { S.view = v.dataset.view; history.replaceState(null, "", "#" + S.view); render(); return; }
  const open = e.target.closest("[data-open]");
  if (open && !e.target.closest("#drawer")) { S.drawer = { date: open.dataset.open }; render(); return; }
  if (e.target === $("#scrim")) { S.drawer = null; render(); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "close") { S.drawer = null; render(); }
  else if (a === "stop") { S.busy?.ctl?.abort(); }
  else if (a === "dismiss-sample") { S.sampleErr = null; render(); }
  else if (a === "reload-strava") { if (mcp) loadStrava(true); }
  else if (a === "analyse") { const r = S.runs.find((x) => x.id === act.dataset.run); if (r) { S.sampleErr = null; analyse(r); } }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.drawer) { S.drawer = null; render(); }
});
document.addEventListener("pointerover", (e) => {
  const g = e.target.closest("[data-tip]"); if (!g) return;
  const tip = g.closest(".chart")?.querySelector(".tip"); if (tip) tip.textContent = g.dataset.tip;
});
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (["week", "calendar", "stats"].includes(v)) { S.view = v; render(); } });

/* ================= Boot ================= */
render();
(async () => {
  if (!window.claude?.use) { S.stravaLoading = false; S.stravaErr = "Open Sub 20 Challenge inside claude.ai to load your Strava runs."; S.store = "local"; lsLoad(); render(); return; }
  initStore();
  claude.use("sample").then((s) => { S.sample = s; render(); });
  mcp = await claude.use("mcp");
  if (!mcp) { S.stravaLoading = false; S.stravaErr = "Connectors aren’t available in this view. Open Sub 20 Challenge in claude.ai."; render(); return; }
  loadStrava(false);
})();
</script>
