<title>Running Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a training log — sticky header with countdown, one view at a time (Week / Calendar / Stats), a side drawer for run detail. Race-bib numerals for times. */
:root {
  --bg: #f1f3ee;
  --surface: #ffffff;
  --surface-2: #e7eae2;
  --line: #d5d9cd;
  --fg: #151a12;
  --fg-2: #4a5244;
  --muted: #737b6c;
  --accent: #4f7a00;
  --accent-strong: #3d5f00;
  --accent-ink: #ffffff;
  --accent-soft: #e3edcc;
  --good: #1f8a4c;
  --warn: #b26b00;
  --bad: #c2362b;
  --easy: #2f6fb5;
  --long: #7a52b3;
  --hard: #d0611a;
  --race: #4f7a00;
  --z1: #b9c7d8; --z2: #2f6fb5; --z3: #4f9a2a; --z4: #d0891a; --z5: #c2362b;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f120d; --surface: #171b14; --surface-2: #20261c; --line: #2d3527;
    --fg: #eef2e8; --fg-2: #b3bba9; --muted: #838c79;
    --accent: #c8f031; --accent-strong: #d8f86a; --accent-ink: #12160a; --accent-soft: #2a3612;
    --good: #4ccf83; --warn: #f0b443; --bad: #f2776c;
    --easy: #6aa6ea; --long: #b392ea; --hard: #f2924f; --race: #c8f031;
  --z1: #4a5568; --z2: #6aa6ea; --z3: #7fd15a; --z4: #f0b443; --z5: #f2776c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f120d; --surface: #171b14; --surface-2: #20261c; --line: #2d3527;
  --fg: #eef2e8; --fg-2: #b3bba9; --muted: #838c79;
  --accent: #c8f031; --accent-strong: #d8f86a; --accent-ink: #12160a; --accent-soft: #2a3612;
  --good: #4ccf83; --warn: #f0b443; --bad: #f2776c;
  --easy: #6aa6ea; --long: #b392ea; --hard: #f2924f; --race: #c8f031;
  --z1: #4a5568; --z2: #6aa6ea; --z3: #7fd15a; --z4: #f0b443; --z5: #f2776c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 88px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.15; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.01em; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent-strong); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 780px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.eyebrow { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand-mark { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; white-space: nowrap; font-style: italic; color: var(--accent); letter-spacing: 0.02em; line-height: 1; }
.brand-sub { font-size: 0.8rem; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; margin-left: auto; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; font-weight: 500; color: var(--fg-2); }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.bottom { display: none; }
@media (max-width: 640px) {
  .tabs, .top { display: none; }
  #view { padding-top: max(12px, env(safe-area-inset-top, 0px)); }
  .bottom { display: flex; position: fixed; inset: auto 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .bottom button { flex: 1; border: 0; background: none; padding: 8px 0; font-weight: 600; font-size: 0.85rem; color: var(--muted); border-radius: 8px; }
  .bottom button[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
}

main { padding-block: 20px; display: flex; flex-direction: column; gap: 18px; }
.banner { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; font-size: 0.9rem; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.banner.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.banner .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
.banner.warn .dot { background: var(--warn); }
.banner.bad .dot { background: var(--bad); }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.small { padding: 5px 10px; font-size: 0.85rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent-strong); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

/* Week header */
.week-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.week-head .range { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; line-height: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 0.75rem; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--fg-2); font-weight: 500; }
.chip.accent { background: var(--accent-soft); color: var(--accent-strong); }

/* Generate card */
.gen { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.gen label { font-size: 0.85rem; font-weight: 600; color: var(--fg-2); display: flex; flex-direction: column; gap: 6px; }
textarea, input[type="text"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; width: 100%; resize: vertical; }
.daypick { display: flex; gap: 6px; flex-wrap: wrap; }
.daypick button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 0; width: 46px; font-weight: 600; font-size: 0.85rem; color: var(--fg-2); }
.daypick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--fg-2); font-size: 0.9rem; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* Summary */
.summary { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; color: var(--fg-2); }

/* Day list */
.days { display: flex; flex-direction: column; gap: 8px; }
.day { display: grid; grid-template-columns: 58px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-align: left; width: 100%; }
button.day:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.day.today { box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
.day.rest { background: transparent; }
.day.done { background: color-mix(in srgb, var(--good) 11%, var(--surface)); border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.day.done .title { color: var(--fg); }
.day.missed { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.status.done { background: var(--good); color: var(--surface); padding: 1px 8px; border-radius: 99px; }
.day .dname { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.1; }
.day .ddate { font-size: 0.75rem; color: var(--muted); }
.day .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.day .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.day .title { font-weight: 600; }
.day .km { margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.km-plan { font-family: var(--font-body); font-weight: 500; font-size: 0.8rem; color: var(--muted); }
.day .details { color: var(--fg-2); font-size: 0.88rem; }
.targets { display: flex; gap: 6px; flex-wrap: wrap; }
.t { font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.t b { color: var(--fg); font-weight: 600; }
.tag { font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--easy); }
.tag.long { color: var(--long); }
.tag.hard { color: var(--hard); }
.tag.race { color: var(--race); }
.tag.rest { color: var(--muted); }
.status { font-size: 0.8rem; font-weight: 600; }

.status.missed { color: var(--bad); }
.done-line { font-size: 0.9rem; font-weight: 600; color: var(--good); font-variant-numeric: tabular-nums; }

/* Chat */
.chat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msgs { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; }
.msg { max-width: 88%; padding: 9px 12px; border-radius: 12px; font-size: 0.92rem; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent-soft); color: var(--fg); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.chat form { display: flex; gap: 8px; }
.chat form textarea { min-height: 44px; }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 2px; font-weight: 600; }
.cell { min-height: 78px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; }
.cell.off { background: transparent; border-style: dashed; opacity: 0.45; }
.cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cell.race { background: var(--accent-soft); border-color: var(--accent); }
.cell.ran { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
button.cell:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.cell .d { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .r { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1; }
.cell .rp { font-size: 0.68rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.cell .p { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; border-bottom: 2px dashed currentColor; padding: 0 0 1px; align-self: flex-start; color: var(--easy); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .p.hard { color: var(--hard); } .cell .p.long { color: var(--long); } .cell .p.race { color: var(--race); }
.cell .miss { font-size: 0.66rem; color: var(--bad); font-weight: 700; }
.month { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; margin-top: 6px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Stats */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 18px; }
.big { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 0.95; font-variant-numeric: tabular-nums; }
.big.goal, .goal-name { color: var(--accent-strong); }
.mid { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.sec-h { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; letter-spacing: 0.01em; margin: 26px 0 10px; text-transform: uppercase; }
.sec-h:first-of-type { margin-top: 8px; }
.kv dt .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; }
.statrow .stat .small { margin-top: 2px; }
tr[data-open]:hover td { background: var(--surface-2); }
.goalform label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--fg-2); }
.goalform input, .goalform select { font: inherit; font-size: 1rem; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0; width: 100%; box-sizing: border-box; }
.goalform { display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 0.9rem; }
.kv dt { color: var(--fg-2); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.gapbar { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.gapbar > div { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.profile svg { height: 34px; }
.profile.big svg { height: auto; }
.profile .ax { font-size: 10px; }
.sections { display: flex; flex-direction: column; gap: 8px; }
.sec { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec .sw { margin-top: 4px; }
.sec-name { font-weight: 600; }
.sec-line { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.flag { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.flag.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.flag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); margin-left: 4px; }
.agrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.alist ul { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.alist.good .eyebrow { color: var(--good); }
.alist.warn .eyebrow { color: var(--warn); }
.next-run { border-left: 3px solid var(--accent); padding-left: 10px; }
.next-run .eyebrow { margin-right: 6px; }
.routemap svg { width: 100%; height: auto; display: block; }
.routemap .ax { fill: var(--fg-2); font-size: 10px; font-family: var(--font-body); }
.card.pending { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 7%, var(--surface)); }
.card.pending .daypick { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.card.pending .daypick button { width: auto; padding: 6px 0; }
.day.pending { background: color-mix(in srgb, var(--warn) 9%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.status.pend { background: var(--warn); color: var(--surface); padding: 1px 8px; border-radius: 99px; }
.pend-line { font-size: 0.9rem; font-weight: 600; color: var(--warn); font-variant-numeric: tabular-nums; }
.cell.pend { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.prof-km { display: inline-flex; gap: 12px; font-variant-numeric: tabular-nums; }
.prof-km strong { font-family: var(--font-display); font-size: 1.25rem; }
.prof-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.profile .tip, .profile .legend { font-family: var(--font-body); font-weight: 400; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart .bar { fill: var(--accent); }
.chart .bar.pre { fill: var(--line); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .goalline { stroke: var(--fg-2); stroke-dasharray: 5 4; stroke-width: 1.5; }
.chart .goallbl { fill: var(--fg-2); font-size: 10px; font-family: var(--font-body); }
.tip { font-size: 0.82rem; color: var(--fg-2); min-height: 1.3em; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { width: min(560px, 100%); height: 100%; background: var(--bg); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px; display: flex; flex-direction: column; gap: 16px; border-left: 1px solid var(--line); }
.drawer-head { display: flex; align-items: flex-start; gap: 12px; }
.drawer-head .x { margin-left: auto; flex: none; }
.statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.verdict { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border-radius: 6px; align-self: flex-start; }
.verdict.nailed { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.verdict.good { background: var(--accent-soft); color: var(--accent-strong); }
.verdict.off-target { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.verdict.unplanned { background: var(--surface-2); color: var(--fg-2); }
.prose { display: flex; flex-direction: column; gap: 10px; color: var(--fg); }
.prose p { white-space: pre-wrap; }
ul.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--fg-2); }
.shoe { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }

<script>
"use strict";
/* ================= Goal (editable on the Goal tab; stored in coach/goal) ================= */
const DEFAULT_GOAL = { name: "Sub 20 5K", distanceM: 5000, targetS: 19 * 60 + 59, date: "2026-12-10", startDate: "2026-11-02", history: [] };
let GOAL = DEFAULT_GOAL, START, RACE, GOAL_S, GOAL_M, GOAL_PACE, GOAL_VDOT, GOAL_DIST;
const DISTS = [[5000, "5K"], [10000, "10K"], [21097.5, "Half marathon"], [42195, "Marathon"]];

const GARMIN = "Garmin";

  vomero: { name: "Nike Vomero Plus", glyph: "V", role: "Max-cushion daily trainer · ≈1 year old" },

  intervals: ["Intervals", "hard"], tempo: ["Tempo", "hard"], goalpace: ["Goal pace", "hard"], timetrial: ["Time trial", "hard"],

const fmtT = (sec) => { if (sec == null || !isFinite(sec)) return "–"; const s = Math.round(sec), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };

/* ================= VDOT model (Jack Daniels) ================= */
const vo2 = (v) => -4.6 + 0.182258 * v + 0.000104 * v * v;

applyGoal(null);

/* ================= State ================= */
const S = {
  view: location.hash === "#progress" ? "stats" : ["goal", "week", "calendar", "stats", "records"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "week",
  runs: [], perf: {}, zones: null, vo2: null, prs: null, stravaErr: null, stravaLoading: true,
  weeks: {}, analyses: {}, logs: {}, insights: "", logsReady: false, allRuns: [], logDrafts: {}, logEffort: {},
  store: null, storeErr: null,
  sample: null, sampleErr: null,
  busy: null, // {kind, ctl}

let mcp = null, db = null;

/* ================= Persistence (private to you) ================= */
const LS = "sub20-store-v1";

async function logRun(run) {

  const effort = S.logEffort[run.id] || null;
  const entry = { comment, effort, loggedAt: Date.now() };
  S.logs[run.id] = entry; applyLogs(); delete S.logDrafts[run.id]; render();

}
/** Plans live in `weeks/<monday>` — written by Claude in your chat. Run analyses live in `analyses/<runId>`. */
async function saveAnalysis(id) {

  try { await db.collection("analyses").doc(id).set(S.analyses[id]); S.storeErr = null; }
  catch (e) { S.storeErr = "Couldn’t save the analysis (" + (e?.code || "error") + "). It’s kept on this device only."; lsSave(); render(); }
}
async function initStore() {

  const onErr = (e) => { clearTimeout(timer); S.storeErr = "Saved plans aren’t available in this view (" + e.code + ")."; render(); };
  db.collection("weeks").onSnapshot((snap) => {
    const weeks = {};

    S.store = "ready"; render();
  }, onErr);
  db.collection("coach").onSnapshot((snap) => {
    const d = snap.docs.find((x) => x.id === "insights");
    S.insights = d && typeof d.data()?.text === "string" ? d.data().text : "";
    const g = snap.docs.find((x) => x.id === "goal")?.data();

    S.goalReady = true; render();
  }, onErr);
  db.collection("logs").onSnapshot((snap) => {
    const l = {};
    for (const doc of snap.docs) { const b = doc.data(); if (b) l[doc.id] = b; }
    S.logs = l; if (!snap.metadata.fromCache) S.logsReady = true; applyLogs(); render();
  }, onErr);

    for (const doc of snap.docs) { const b = doc.data(); if (b && b.v) { S.streams[doc.id] = b; mergeStream(doc.id); } }
    if (!snap.metadata.fromCache && !S.streamsReady) { S.streamsReady = true; if (S.perfDone) loadStreams(); }
    render();

    const a = {};
    for (const doc of snap.docs) { const b = doc.data(); if (b) a[doc.id] = b; }

/* ================= Garmin (through your connector) ================= */
const RUN_TYPES = ["Run"];
const G_RUN = ["running", "treadmill_running", "trail_running", "track_running", "indoor_running", "virtual_run", "street_running"];
const G_BALL = ["soccer", "football", "soccer_football"];
const isRunning = (r) => RUN_TYPES.includes(r.sport);
function mapRun(a) {
  const km = (num(a.distance_meters) ?? 0) / 1000;
  const moving = num(a.moving_duration_seconds) ?? num(a.duration_seconds) ?? 0;
  const st = String(a.start_time || "").replace(" ", "T");
  return {
    id: String(a.id), name: a.name || "Run", date: st.slice(0, 10), start: st,
    km, moving, elapsed: num(a.duration_seconds) ?? moving, pace: km ? moving / km : undefined,
    elev: num(a.elevation_gain_meters), kcal: num(a.calories), avgHr: num(a.avg_hr_bpm), maxHr: num(a.max_hr_bpm),
    sport: G_BALL.includes(a.type) ? "Soccer" : "Run", gtype: a.type,
  };
}
/** Fastest time over `dist` metres from laps (linear inside a lap). */
function bestOver(laps, dist) {
  const L = laps.filter((l) => l.m > 0 && l.t > 0);
  const tot = L.reduce((a, l) => a + l.m, 0);
  if (tot < dist * 0.98) return;
  let best;
  for (let i = 0; i < L.length; i++) {
    let m = 0, t = 0;
    for (let j = i; j < L.length; j++) {
      const need = dist - m;
      if (L[j].m >= need) { t += L[j].t * (need / L[j].m); m = dist; break; }
      m += L[j].m; t += L[j].t;
    }
    if (m >= dist && (best == null || t < best)) best = t;
  }
  return best;
}
function mapPerf(d, splits, zones) {
  const laps = ((splits && (splits.laps || splits.lapDTOs)) || []).map((l) => ({
    m: num(l.distance_meters) ?? num(l.distance) ?? 0, t: num(l.moving_duration_seconds) ?? num(l.duration_seconds) ?? 0,
    watts: num(l.avg_power_watts), cad: num(l.avg_cadence), hr: num(l.avg_hr_bpm), maxHr: num(l.max_hr_bpm), elev: num(l.elevation_gain_meters),
  }));
  const best = {};
  for (const [k, m] of Object.entries({ Fastest400: 400, Fastest1k: 1000, FastestMile: 1609.34, Fastest2Mile: 3218.69, Fastest5k: 5000, Fastest10k: 10000 })) {
    const t = bestOver(laps, m); if (t) best[k] = t;
  }
  const z = Array.isArray(zones) ? zones : (zones && (zones.zones || zones.hr_zones)) || [];

    hasHr: !!avgHr, avgHr, maxHr: num(d?.max_hr_bpm), watts: num(d?.avg_power_watts), np: num(d?.normalized_power_watts),
    cadence: num(d?.avg_cadence), strideCm: num(d?.avg_stride_length_cm), gctMs: num(d?.avg_ground_contact_time_ms), voCm: num(d?.avg_vertical_oscillation_cm),
    teLabel: d?.training_effect_label || null,
    zones: z.map((x) => ({ zone: num(x.zoneNumber) ?? num(x.zone), secs: num(x.secsInZone) ?? num(x.seconds) ?? 0 })),

}
const GC = (tool, input, stale = 6048e5) => mcp.callTool(GARMIN, tool, input, { cache: { staleTime: stale, gcTime: 6048e5 } }).then((r) => r.payload);
async function loadGarmin(refresh = false) {
  S.stravaLoading = true; S.stravaErr = null; render();
  try {
    let page = 0, list = [];
    for (let n = 0; n < 5; n++) {
      const p = await mcp.callTool(GARMIN, "get_activities_by_date", { start_date: CONTEXT_FROM, end_date: today(), page, page_size: 200 },
        { cache: { staleTime: 0, gcTime: 6048e5, refresh: true } });
      const pl = p.payload || {};
      list = list.concat(pl.activities || []);
      if (!pl.has_more) break;
      page = pl.next_page ?? page + 1;
    }
    S.allRuns = list.filter((a) => G_RUN.includes(a.type) || G_BALL.includes(a.type)).map(mapRun).sort((a, b) => String(a.start).localeCompare(String(b.start)));
    applyLogs();
    S.stravaLoading = false; render();
    loadFitness();
    await loadPerfs();
    S.perfDone = true; if (S.streamsReady) loadStreams();
  } catch (e) {
    S.stravaLoading = false;
    S.stravaErr = garminMsg(e);
    render();
  }
}
async function loadFitness() {
  try { S.vo2 = await GC("get_vo2max_trend", { start_date: addDays(today(), -89), end_date: today() }, 864e5 / 4); render(); } catch (e) { console.warn("vo2", e); }

}
/** Garmin VO2max trend → {latest, delta, days, pts} using measured days only. */
function vo2Trend() {
  const tr = (S.vo2 && (S.vo2.trend || S.vo2.data || S.vo2.values)) || [];
  const pts = tr.filter((x) => num(x.vo2_max) && !x.carried_forward).map((x) => ({ date: String(x.date).slice(0, 10), v: x.vo2_max }));
  if (!pts.length) { const l = num(S.vo2?.latest_vo2_max) ?? num(S.vo2?.latest?.vo2_max) ?? num(S.vo2?.current?.vo2_max); return l ? { latest: l, delta: 0, days: 0, pts: [] } : null; }

const TE_NAMES = { RECOVERY: "Recovery", AEROBIC_BASE: "Base", BASE: "Base", TEMPO: "Tempo", THRESHOLD: "Threshold", LACTATE_THRESHOLD: "Threshold", VO2MAX: "VO2max", ANAEROBIC_CAPACITY: "Anaerobic", ANAEROBIC: "Anaerobic", SPRINT: "Sprint" };

/** Shoe per run = the shoe the plan picked for that day (you run in the suggested pair). */
function shoeOf(run) { const s = S.weeks[monday(run.date)]?.sessions?.find((x) => x.date === run.date); return s && SHOES[s.shoe] && s.shoe !== "none" ? s.shoe : null; }
function shoeKm() {
  const out = {};
  for (const k of ["vomero", "cloudmonster", "vaporfly"]) out[k] = { start: SHOE_START_KM[k] || 0, challenge: 0 };

const FATAL = ["needs_reauth", "server_not_connected", "not_in_manifest", "blocked_by_policy", "approval_required"];
async function loadPerfs() {
  const need = S.allRuns.filter((r) => !S.perf[r.id]).reverse(); // newest first
  let i = 0;
  const worker = async () => {
    while (i < need.length) {
      const r = need[i++];
      try {
        const [d, sp, z] = await Promise.all([
          GC("get_activity", { activity_id: Number(r.id) }),
          GC("get_activity_splits", { activity_id: Number(r.id) }).catch(() => null),
          GC("get_activity_hr_in_timezones", { activity_id: Number(r.id) }).catch(() => null),
        ]);
        S.perf[r.id] = mapPerf(d || {}, sp, z); mergeStream(r.id);
        if (S.perf[r.id].cadence) r.cadence = S.perf[r.id].cadence;
        const mv = num(d?.moving_duration_seconds);
        if (mv && r.km) { r.moving = mv; r.pace = mv / r.km; }
        render();
      } catch (e) {
        if (FATAL.includes(e?.code)) { S.stravaErr = garminMsg(e); render(); return; }

function garminMsg(e) {
  switch (e?.code) {
    case "needs_reauth": return "Your Garmin connection has expired. Reconnect Garmin in claude.ai Settings → Connectors, then reload.";
    case "server_not_connected": return "Garmin isn’t connected. Add the Garmin connector in claude.ai Settings → Connectors, then reload.";
    case "selection_required": return "You have more than one Garmin connector — choose one when claude.ai asks, then reload.";
    case "not_in_manifest": case "approval_required": return "Running Coach needs your permission to read Garmin. Tap “Load runs” and allow it.";
    case "blocked_by_policy": return "Your organisation blocks the Garmin connector for this page.";
    case "server_unavailable": case "upstream_error": return "Garmin didn’t answer just now. Try again in a minute.";
    case "tool_error": return "Garmin reported an error: " + (e.message || "unknown") + ".";
    default: return "Couldn’t load Garmin (" + (e?.code || "unknown") + ").";
  }

/* ================= Per-second data from the watch file (route, exact best efforts, drift) ================= */
const SEMI = 180 / 2 ** 31;
const fv = (m, n) => { const f = m.fields?.find((x) => x.name === n); return f ? f.value : undefined; };
/** Exact fastest time over `dist` metres from per-second distance/time (linear interpolation). */
function bestFromStream(ts, ds, dist) {
  let best, j = 0;
  for (let i = 0; i < ds.length; i++) {
    while (j < ds.length && ds[j] - ds[i] < dist) j++;
    if (j >= ds.length) break;
    const over = ds[j] - ds[i] - dist, seg = ds[j] - ds[j - 1];
    const t = ts[j] - ts[i] - (seg > 0 ? (over / seg) * (ts[j] - ts[j - 1]) : 0);
    if (t > 0 && (best == null || t < best)) best = t;
  }
  return best;
}
function summariseStream(recs) {

    t: Date.parse(fv(m, "timestamp") + "Z") / 1000, lat: fv(m, "position_lat"), lon: fv(m, "position_long"), d: fv(m, "distance"),
    v: fv(m, "enhanced_speed") ?? fv(m, "speed"), hr: fv(m, "heart_rate"), w: fv(m, "power"),
  })).filter((x) => isFinite(x.t) && typeof x.d === "number");
  if (R.length < 10) return null;
  const t0 = R[0].t, ts = R.map((x) => x.t - t0), ds = R.map((x) => x.d);
  // route: keep ~400 points

    if (planned) line += ` | planned: ${planned.title} (${planned.distanceKm} km)`;
    const lg = S.logs[r.id];
    if (lg?.effort) line += ` | felt ${lg.effort}/10`;
    if (lg?.comment) line += ` | athlete: "${lg.comment.slice(0, 300)}"`;
    if (pf?.laps?.length >= 3 && pf.laps.length <= 30) line += `\n    laps: ${pf.laps.map((l) => `${Math.round(l.m)}m ${fmtP(l.t / (l.m / 1000))}${l.watts ? " " + Math.round(l.watts) + "W" : ""}`).join("; ")}`;

  const prev = S.weeks[addDays(weekStart, -7)];

    L.push(`LAST WEEK'S PLAN: ${planned.filter((s) => runsOn(s.date).length).length}/${planned.length} runs completed. Notes then: "${prev.notes || "—"}"`);

  if (S.insights) L.push("COACHING RULES AND INSIGHTS LEARNED SO FAR (always apply):\n" + S.insights.slice(0, 6000));

}

/* ---------- Session profile: each section in order, height = pace ---------- */
const PIECE_COLOR = { easy: "var(--easy)", work: "var(--hard)", stride: "var(--long)", rest: "#ffffff" };
/** Planned distance = sum of every section, strides and walk/jog recoveries included */

    if (g.reps && g.work) {
      for (let i = 1; i <= g.reps; i++) {
        out.push(tagG(mk(g.kind === "strides" ? "stride" : "work", g.work, `${g.label} ${i}/${g.reps}`)));
        if (g.rest && (i < g.reps || !g.dropLastRest)) out.push(tagG(mk("rest", g.rest, g.rest.label || "Recovery")));
      }
    } else if (g.km) out.push(tagG({ kind: "easy", km: g.km, pace: g.pace, label: g.label }));

/** Pair the run's laps with the plan's sections (works when you lap each section) */

function sectionTable(rows) {

  const tgt = (r) => [r.target.pace ? range(r.target.pace, fmtT) + "/km" : r.target.sec ? `${r.target.sec} s` : "", r.target.watts ? range(r.target.watts, String) + " W" : "", r.target.hr ? range(r.target.hr, String) + " bpm" : ""].filter(Boolean).join(" · ");

function profile(s, big, run) {

  const total = ps.reduce((a, p) => a + p.km, 0), totalT = ps.reduce((a, p) => a + dur(p), 0);

    const dist = p.sec ? (p.sec >= 60 && p.sec % 60 === 0 ? `${p.sec / 60} min` : `${p.sec} s`) : p.km >= 1 ? `${+p.km.toFixed(2)} km` : `${Math.round(p.km * 1000)} m`;

    x += w;
  }
  if (big) {
    const work = ps.filter((p) => p.kind === "work");
    const refs = [...new Set([work.length ? mid(work[0]) : null, mid(ps.find((p) => p.kind === "easy") || ps[0])].filter(Boolean).map(Math.round))];
    g = refs.map((r) => `<line class="grid" x1="0" x2="${W}" y1="${(H - B - hgt(r)).toFixed(1)}" y2="${(H - B - hgt(r)).toFixed(1)}" stroke-dasharray="3 3"/><text class="ax" x="${W}" y="${(H - B - hgt(r) - 3).toFixed(1)}" text-anchor="end">${fmtT(r)}/km</text>`).join("") + g;
    g += `<text class="ax" x="0" y="${H - 4}">Start</text><text class="ax" x="${W}" y="${H - 4}" text-anchor="end">Finish</text>`;
  }
  const kinds = [...new Set(ps.map((p) => p.kind))];
  const legend = big ? `<div class="legend small">${kinds.map((k) => `<span><i class="sw" style="background:${PIECE_COLOR[k]}${k === "rest" ? ";border:1px solid var(--fg-2)" : ""}"></i>${{ easy: "Easy / warm-up", work: "Work", stride: "Strides", rest: "Recovery" }[k]}</span>`).join("")}</div>` : "";
  const head = big ? `<div class="prof-head"><span class="eyebrow">Sections</span><span class="prof-km"><span><span class="muted small">Planned</span> <strong>${esc(planKm(s).toFixed(1))} km</strong></span>${run ? `<span><span class="muted small">Ran</span> <strong>${run.km.toFixed(2)} km</strong></span>` : ""}</span></div>` : "";
  return `<div class="chart profile${big ? " big" : ""}">${head}<svg viewBox="0 0 ${W} ${H}" ${big ? "" : 'preserveAspectRatio="none"'} role="img" aria-label="Session sections in order">${g}</svg>${big ? `<div class="tip" aria-live="polite">Hover or tap a section for its pace.</div>` : ""}${legend}</div>`;
}

function renderWeek() {

function chartScatter(pts) {
  if (pts.length < 3) return `<p class="muted small">${S.allRuns.some((r) => S.perf[r.id]) ? "Not enough laps yet." : "Loading…"}</p>`;
  const W = 360, H = 180, L = 34, R = 8, T = 12, B = 24;
  const pl = Math.min(...pts.map((p) => p.pace), 230), ph = Math.max(...pts.map((p) => p.pace), 360);
  const cl = Math.min(150, ...pts.map((p) => p.cad)) - 2, ch = Math.max(185, ...pts.map((p) => p.cad)) + 2;
  const X = (pace) => L + ((ph - pace) / (ph - pl)) * (W - L - R); // faster to the right
  const Y = (c) => H - B - ((c - cl) / (ch - cl)) * (H - T - B);
  let g = [160, 170, 180].filter((c) => c > cl && c < ch).map((c) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(c)}" y2="${Y(c)}"/><text class="ax" x="${L - 5}" y="${Y(c) + 3}" text-anchor="end">${c}</text>`).join("");
  g += `<rect x="${L}" y="${Y(180)}" width="${W - L - R}" height="${Math.max(0, Y(175) - Y(180))}" fill="var(--accent-soft)" opacity="0.8"/><text class="goallbl" x="${L + 4}" y="${Y(180) - 3}">175–180 target</text>`;
  g += `<line class="goalline" x1="${X(GOAL_PACE)}" x2="${X(GOAL_PACE)}" y1="${T}" y2="${H - B}"/><text class="goallbl" x="${X(GOAL_PACE) - 3}" y="${H - B - 4}" text-anchor="end">4:00</text>`;
  for (const v of [360, 300, 240].filter((v) => v >= pl && v <= ph)) g += `<text class="ax" x="${X(v)}" y="${H - 6}" text-anchor="middle">${fmtT(v)}</text>`;
  g += pts.map((p) => `<g data-tip="${esc(fdate(p.d, { day: "numeric", month: "short" }))}: ${fmtP(p.pace)} · ${Math.round(p.cad)} spm · ${p.stride.toFixed(2)} m"><circle cx="${X(p.pace).toFixed(1)}" cy="${Y(p.cad).toFixed(1)}" r="9" fill="transparent"/><circle class="dot" cx="${X(p.pace).toFixed(1)}" cy="${Y(p.cad).toFixed(1)}" r="3"/></g>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cadence against pace for each lap">${g}</svg><div class="tip" aria-live="polite"></div></div><p class="small muted">Faster pace to the right.</p>`;
}

const hms = (s) => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
const parseHms = (str) => { const p = String(str).trim().split(":").map(Number); if (!p.length || p.some((x) => !isFinite(x) || x < 0)) return null; return p.reduce((a, x) => a * 60 + x, 0) || null; };

async function saveGoal() {
  const v = (id) => document.getElementById(id)?.value ?? "";
  const name = v("g-name").trim() || "Goal";
  const ds = v("g-dist");
  const distanceM = ds === "custom" ? Number(v("g-km")) * 1000 : Number(ds);
  const targetS = parseHms(v("g-time"));
  const date = v("g-date"), startDate = v("g-start");
  if (!(distanceM >= 1000)) { S.goalErr = "Set a distance of 1 km or more."; render(); return; }
  if (!targetS) { S.goalErr = "Write the target time as mm:ss or h:mm:ss."; render(); return; }
  if (!/^\d{4}-\d\d-\d\d$/.test(date) || !/^\d{4}-\d\d-\d\d$/.test(startDate) || startDate >= date) { S.goalErr = "Race date must be after the training start."; render(); return; }
  const changed = GOAL.distanceM !== distanceM || GOAL.targetS !== targetS || GOAL.date !== date || GOAL.name !== name || GOAL.startDate !== startDate;
  if (!changed) { S.goalEdit = false; S.goalErr = null; render(); return; }
  const prev = { name: GOAL.name, distanceM: GOAL.distanceM, targetS: GOAL.targetS, date: GOAL.date, startDate: GOAL.startDate, until: today() };
  const next = { name, distanceM, targetS, date, startDate, updatedAt: Date.now(), history: [...(GOAL.history || []), prev].slice(-20) };
  applyGoal(next); applyLogs(); S.goalEdit = false; S.goalErr = null; S.goalDraft = {}; render();
  if (db) { try { await db.collection("coach").doc("goal").set(next); } catch (e) { S.storeErr = "Couldn’t save the goal (" + (e?.code || "error") + ")."; render(); } }
}

  let h = `<section class="statrow">

  h += formRow(pf);

  const rows = s ? sectionRows(r, s) : null;

  if (!isLogged(r)) { if (S.logsReady) h += pendingCard(r); return h; }
  const lg = S.logs[r.id];
  if (lg && (lg.comment || lg.effort)) h += `<section class="card"><div class="eyebrow">Your notes</div>${lg.effort ? `<p class="small">Effort <strong>${esc(lg.effort)}/10</strong></p>` : ""}${lg.comment ? `<p>${esc(lg.comment)}</p>` : ""}</section>`;
  h += `<section class="card" aria-labelledby="an-${esc(r.id)}"><h3 id="an-${esc(r.id)}">Coach’s take</h3>`;
  if (S.busy?.kind === "analyse" && S.busy.runId === r.id) h += busyLine("analyse", "The coach is reviewing this run…");
  else if (a) {
    const list = (title, xs, cls) => (xs?.length ? `<div class="alist ${cls}"><div class="eyebrow">${title}</div><ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "");
    h += `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="verdict ${esc(a.verdict)}">${esc({ nailed: "Nailed it", good: "Good", "off-target": "Off target", unplanned: "Unplanned" }[a.verdict] || a.verdict)}</span><strong>${esc(a.headline)}</strong></div>
      <div class="agrid">${list("Went well", a.good, "good")}${list("Work on", a.improve, "warn")}</div>
      ${a.next ? `<p class="next-run"><span class="eyebrow">Next run</span> ${esc(a.next)}</p>` : ""}
      <p class="small muted">Analysed ${esc(new Date(a.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))} · <button class="linkish" data-act="analyse" data-run="${esc(r.id)}" ${S.busy || !S.sample ? "disabled" : ""}>Analyse again</button></p>`;
  } else h += `<p class="muted small">${pf ? "A short verdict on this run, from the coach." : "Loading laps from Garmin…"}</p><button class="btn primary" data-act="analyse" data-run="${esc(r.id)}" ${S.busy || !S.sample || !pf ? "disabled" : ""}>Analyse this run</button>`;
  h += `</section>`;
  return h;
}

function renderHeader() {
  const left = daysBetween(today(), RACE);

  for (const b of document.querySelectorAll("[data-view]")) b.setAttribute("aria-current", b.dataset.view === S.view ? "page" : "false");
}
let lastView = null;
function render() {
  const fid = document.activeElement?.dataset?.log, sel = fid ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  const gid = /^g-/.test(document.activeElement?.id || "") ? document.activeElement.id : null;
  renderHeader();
  const view = $("#view");
  if (S.stravaLoading && !S.allRuns.length && !S.stravaErr) view.innerHTML = `<div class="empty"><div class="spinner"></div><p>Loading your runs from Garmin…</p></div>`;
  else view.innerHTML = S.view === "week" ? renderWeek() : S.view === "calendar" ? renderCalendar() : S.view === "records" ? renderRecords() : S.view === "goal" ? renderGoal() : renderStats();
  if (lastView !== S.view) { window.scrollTo(0, 0); lastView = S.view; }
  const scrim = $("#scrim");
  if (S.drawer) { $("#drawer").innerHTML = renderDrawer(); scrim.hidden = false; } else scrim.hidden = true;
  if (gid) document.getElementById(gid)?.focus();
  if (fid) { const el = (S.drawer ? $("#drawer") : $("#view")).querySelector(`[data-log="${CSS.escape(fid)}"]`) || document.querySelector(`[data-log="${CSS.escape(fid)}"]`); if (el) { el.focus(); if (sel) el.setSelectionRange(sel[0], sel[1]); } }
}

/* ================= Events ================= */
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]");
  if (v) { S.view = v.dataset.view; history.replaceState(null, "", "#" + S.view); render(); return; }
  const open = e.target.closest("[data-open]");
  if (open && !e.target.closest("#drawer")) { S.drawer = { date: open.dataset.open }; render(); return; }
  if (e.target === $("#scrim")) { S.drawer = null; render(); return; }
  const ef = e.target.closest("[data-effort]");
  if (ef) { const id = ef.dataset.run, n = Number(ef.dataset.effort); S.logEffort[id] = S.logEffort[id] === n ? undefined : n; render(); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "close") { S.drawer = null; render(); }
  else if (a === "stop") { S.busy?.ctl?.abort(); }
  else if (a === "dismiss-sample") { S.sampleErr = null; render(); }
  else if (a === "edit-goal") { S.goalEdit = !S.goalEdit; S.goalErr = null; S.goalDraft = {}; render(); }
  else if (a === "save-goal") { saveGoal(); }
  else if (a === "reload-strava") { if (mcp) loadGarmin(true); }
  else if (a === "log") { const r = S.allRuns.find((x) => x.id === act.dataset.run); if (r) { S.sampleErr = null; logRun(r); } }
  else if (a === "analyse") { const r = S.allRuns.find((x) => x.id === act.dataset.run); if (r) { S.sampleErr = null; analyse(r); } }
});
document.addEventListener("input", (e) => { const id = e.target?.dataset?.log; if (id) S.logDrafts[id] = e.target.value; if (/^g-/.test(e.target?.id || "")) S.goalDraft[e.target.id] = e.target.value; });
document.addEventListener("change", (e) => { if (/^g-/.test(e.target?.id || "")) { S.goalDraft[e.target.id] = e.target.value; if (e.target.id === "g-dist") render(); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.drawer) { S.drawer = null; render(); }
});
document.addEventListener("pointerover", (e) => {
  const g = e.target.closest("[data-tip]"); if (!g) return;
  const tip = g.closest(".chart")?.querySelector(".tip"); if (tip) tip.textContent = g.dataset.tip;
});
window.addEventListener("hashchange", () => { let v = location.hash.slice(1); if (v === "progress") v = "stats"; if (["goal", "week", "calendar", "stats", "records"].includes(v)) { S.view = v; render(); } });

/* ================= Boot ================= */
render();
(async () => {
  if (!window.claude?.use) { S.stravaLoading = false; S.stravaErr = "Open Running Coach inside claude.ai to load your Garmin runs."; S.store = "local"; lsLoad(); render(); return; }
  initStore();
  claude.use("sample").then((s) => { S.sample = s; render(); });
  mcp = await claude.use("mcp");
  if (!mcp) { S.stravaLoading = false; S.stravaErr = "Connectors aren’t available in this view. Open Running Coach in claude.ai."; render(); return; }
  loadGarmin(false);
})();
</script>
